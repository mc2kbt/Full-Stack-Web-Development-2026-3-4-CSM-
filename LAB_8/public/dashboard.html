<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gemini Chat Interface</title>
    <style>
        body { font-family: Arial, sans-serif; background: #131314; color: #e3e3e3; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e1f20; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        .message { padding: 12px 18px; border-radius: 12px; max-width: 75%; line-height: 1.5; font-size: 15px; }
        .user-msg { background: #004a77; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background: #1e1f20; color: #e3e3e3; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #333; }
        .input-area { background: #1e1f20; padding: 15px; display: flex; justify-content: center; border-top: 1px solid #333; }
        .input-box { max-width: 800px; width: 100%; display: flex; background: #2d2e30; border-radius: 24px; padding: 8px 15px; align-items: center; }
        input { flex: 1; background: transparent; border: none; color: white; font-size: 16px; outline: none; }
        button { background: #8ab4f8; color: #202124; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        button:hover { background: #aecbfa; }
        .logout-btn { background: #d93025; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 14px; }
        .logout-btn:hover { background: #b31412; }
    </style>
</head>
<body>

    <header>
        <div>✨ <strong><span id="botName">Gemini Assistant</span></strong> &nbsp;|&nbsp; User: <span id="user"></span></div>
        <a href="#" id="logout" class="logout-btn">Logout</a>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message bot-msg">Hello! I am your personal AI chatbot. Ask me anything or type a prompt below!</div>
    </div>

    <div class="input-area">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Enter a prompt here...">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        // Check if user is logged in
        const data = JSON.parse(localStorage.getItem('user'));
        if (!data) window.location.href = 'login.html';

        document.getElementById('user').innerText = data.username;
        if(data.botName) document.getElementById('botName').innerText = data.botName;

        // Logout action
        document.getElementById('logout').onclick = (e) => {
            e.preventDefault();
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        };

        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}-msg`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight; // Auto scroll to bottom
        }

        // Send message functionality
        sendBtn.onclick = () => {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';

            // Simulate AI reply response
            setTimeout(() => {
                addMessage(`I processed your message: "${text}". How else can I assist you with your experiment today?`, 'bot');
            }, 700);
        };

        // Allow pressing "Enter" to send
        userInput.onkeypress = (e) => {
            if (e.key === 'Enter') sendBtn.click();
        };
    </script>
</body>
</html>
